<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Indian Veg Recipe App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Indian Vegetarian Recipe App</h1>
    <input type="text" id="search" placeholder="Search recipes...">
    <div class="tabs">
      <button class="tab active" data-category="All">All</button>
      <button class="tab" data-category="Breakfast">Breakfast</button>
      <button class="tab" data-category="Lunch">Lunch</button>
      <button class="tab" data-category="Dinner">Dinner</button>
      <button class="tab" data-category="Snacks">Snacks</button>
      <button class="tab" data-category="Drinks">Drinks</button>
      <button class="tab" data-category="Desserts">Desserts</button>
    </div>
  </header>
  <main id="recipe-list"></main>

  <script src="script.js"></script>
</body>
</html>
